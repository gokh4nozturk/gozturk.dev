# Continuous Integration — lint + build verification.
# Deployment is handled by Vercel; this only guards against broken pushes/PRs.
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_GITHUB_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_GITHUB_ACCESS_TOKEN }}
          NEXT_PUBLIC_UNSPLASH_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_UNSPLASH_ACCESS_KEY }}
          NEXT_PUBLIC_RAINDROP_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_RAINDROP_ACCESS_TOKEN }}
